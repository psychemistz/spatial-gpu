# =============================================================================
# GitHub Pages: build + deploy docs/
#
# Replaces the auto-generated pages-build-deployment workflow (which still
# pins actions/checkout@v4 and actions/upload-artifact@v4 on Node 20).
#
# After merging, switch Settings -> Pages -> Source from "Deploy from a
# branch" to "GitHub Actions" so this workflow becomes the active deployer.
# =============================================================================

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Force Node 24 for any v4/v5 actions still shipping Node 20
  # (e.g. actions/configure-pages@v5 as of 2026-04).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
